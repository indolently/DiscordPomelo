[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-pomelo"
version = "0.1.0"
description = "A small client for Discord username/pomelo requests."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
]

[tool.setuptools.packages.find]
where = ["src"]
